name: TASK-11 Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Tag Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t task11-izan-repo:$IMAGE_TAG .
          docker tag task11-izan-repo:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/task11-izan-repo:$IMAGE_TAG

      - name: Push Docker Image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/task11-izan-repo:$IMAGE_TAG

      - name: Register New Task Definition
        run: |
          IMAGE_TAG=${{ github.sha }}
          TASK_DEF=$(aws ecs describe-task-definition --task-definition task11-izan-task)
          
          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/task11-izan-repo:$IMAGE_TAG" '
          .taskDefinition |
          .containerDefinitions[0].image=$IMAGE |
          del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
          
          echo "$NEW_TASK_DEF" > new-task-def.json
          
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Create CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name task11-izan-app \
            --deployment-group-name task11-izan-dg \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --revision revisionType=AppSpecContent,appSpecContent="{\"version\":1,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"task11-izan-task\",\"LoadBalancerInfo\":{\"ContainerName\":\"task11-container\",\"ContainerPort\":80}}}}]}"