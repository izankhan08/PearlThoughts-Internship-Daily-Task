name: TASK-11 Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: task11-izan-repo
      ECS_TASK_FAMILY: task11-izan-task
      CODEDEPLOY_APP: task11-izan-app
      CODEDEPLOY_DG: task11-izan-dg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

          docker build -t $ECR_URI:$IMAGE_TAG TASK-11-Deploy-to-ECS-using-GitHub-Actions-CodeDeploy
          docker push $ECR_URI:$IMAGE_TAG

      - name: Register New ECS Task Definition
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

          TASK_DEF=$(aws ecs describe-task-definition --task-definition $ECS_TASK_FAMILY)

          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "$ECR_URI:$IMAGE_TAG" \
            '.taskDefinition |
             .containerDefinitions[0].image=$IMAGE |
             del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')

          echo "$NEW_TASK_DEF" > new-task-def.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Trigger CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APP \
            --deployment-group-name $CODEDEPLOY_DG \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --revision "$(jq -n \
              --arg TASK_DEF "$TASK_DEF_ARN" \
              '{
                revisionType: "AppSpecContent",
                appSpecContent: {
                  content: (
                    {
                      version: 1,
                      Resources: [
                        {
                          TargetService: {
                            Type: "AWS::ECS::Service",
                            Properties: {
                              TaskDefinition: $TASK_DEF,
                              LoadBalancerInfo: {
                                ContainerName: "task11-container",
                                ContainerPort: 80
                              }
                            }
                          }
                        }
                      ]
                    } | tostring
                  )
                }
              }')"